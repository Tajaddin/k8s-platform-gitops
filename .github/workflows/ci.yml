name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  charts:
    name: helm lint, template, kubeconform and conftest for every env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with: { version: v3.17.3 }
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
      - name: tools
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.62.0/conftest_0.62.0_Linux_x86_64.tar.gz | tar xz -C /usr/local/bin conftest
      - run: for c in charts/*; do helm lint "$c"; done
      - name: render every chart for every env and validate the manifests
        run: |
          mkdir -p out
          for env in local oci; do
            for c in charts/*; do
              name=$(basename "$c"); vf="envs/$env/values/$name.yaml"
              helm template "$name" "$c" -n "$name" ${vf:+$( [ -f "$vf" ] && echo -f "$vf" )} > "out/$env-$name.yaml"
            done
            kubectl kustomize "envs/$env/apps" > "out/$env-apps.yaml"
          done
          kubeconform -strict -ignore-missing-schemas -summary out/*.yaml
          conftest test out/*.yaml -p platform/policies
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: rendered-manifests, path: out, retention-days: 7 }

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_version: "1.9.8" }
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck scripts/*.sh chaos/*.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
