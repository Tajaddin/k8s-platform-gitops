apiVersion: v1
kind: Service
metadata:
  name: opensearch
  labels:
    app.kubernetes.io/name: opensearch
    {{- include "search.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: opensearch }
  ports:
    - { name: http, port: 9200, targetPort: 9200, protocol: TCP }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  labels:
    app.kubernetes.io/name: opensearch
    {{- include "search.labels" . | nindent 4 }}
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: opensearch }
  template:
    metadata:
      labels: { app.kubernetes.io/name: opensearch }
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: opensearch
          image: {{ include "search.image" .Values.images.opensearch }}
          env:
            - { name: discovery.type, value: single-node }
            - { name: DISABLE_SECURITY_PLUGIN, value: "true" }
            - { name: OPENSEARCH_JAVA_OPTS, value: {{ .Values.opensearch.javaOpts | quote }} }
            - { name: bootstrap.memory_lock, value: "false" }
          ports:
            - { name: http, containerPort: 9200, protocol: TCP }
          resources: {{ toYaml .Values.opensearch.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /_cluster/health, port: 9200 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /_cluster/health, port: 9200 }
            initialDelaySeconds: 90
            periodSeconds: 30
          volumeMounts:
            - { name: data, mountPath: /usr/share/opensearch/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.opensearch.storageClass }}
        storageClassName: {{ .Values.opensearch.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.opensearch.storage }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensearch
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: opensearch }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: search-api }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: search-indexer }
      ports: [{ protocol: TCP, port: 9200 }]
  egress: []
