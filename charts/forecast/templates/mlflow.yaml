apiVersion: v1
kind: Service
metadata:
  name: mlflow
  labels:
    app.kubernetes.io/name: mlflow
spec:
  selector: { app.kubernetes.io/name: mlflow }
  ports:
    - { name: http, port: 5000, targetPort: 5000, protocol: TCP }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.mlflow.storageClass }}
  storageClassName: {{ .Values.mlflow.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mlflow.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app.kubernetes.io/name: mlflow
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: mlflow }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mlflow }
    spec:
      containers:
        - name: mlflow
          image: {{ .Values.images.mlflow.repository }}:{{ .Values.images.mlflow.tag }}
          command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
                    "--backend-store-uri", "sqlite:////mlflow/mlflow.db",
                    "--artifacts-destination", "/mlflow/artifacts", "--serve-artifacts", "--workers", "1",
                    "--allowed-hosts", "mlflow,mlflow:5000,mlflow.{{ .Release.Namespace }},mlflow.{{ .Release.Namespace }}.svc,mlflow.{{ .Release.Namespace }}.svc.cluster.local,localhost,127.0.0.1"]
          ports: [{ name: http, containerPort: 5000, protocol: TCP }]
          resources: {{ toYaml .Values.mlflow.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /mlflow }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mlflow-data }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlflow
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: mlflow }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: forecast-api }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: forecast-train }
      ports: [{ protocol: TCP, port: 5000 }]
  egress: []
