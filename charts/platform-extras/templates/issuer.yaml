{{- if eq .Values.issuer.kind "selfsigned" }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-issuer
spec:
  selfSigned: {}
{{- else }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-issuer
spec:
  acme:
    email: {{ .Values.issuer.email | quote }}
    server: {{ .Values.issuer.server }}
    privateKeySecretRef:
      name: platform-issuer-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
{{- end }}
