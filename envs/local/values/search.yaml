host: search.localtest.me
images:
  api: { repository: hss/api, tag: local, pullPolicy: Never }
  ui: { repository: hss/ui, tag: local, pullPolicy: Never }
api:
  replicas: 2
  resources:
    requests: { cpu: 300m, memory: 1Gi }
    limits: { cpu: "2", memory: 2560Mi }
opensearch:
  javaOpts: "-Xms1g -Xmx1g"
  storage: 5Gi
  storageClass: local-path
  resources:
    requests: { cpu: 300m, memory: 1536Mi }
    limits: { memory: 2560Mi }
data:
  preparedHostPath: /mnt/hss-prepared
  modelsHostPath: /mnt/hss-models
secrets:
  sealed: false
  adminKey: local-admin-key
