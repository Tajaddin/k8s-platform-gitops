apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: search
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: git://host.k3d.internal:9418/k8s-platform-gitops.git
    targetRevision: main
    path: charts/search
    helm:
      valueFiles:
        - ../../envs/local/values/search.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: search
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
