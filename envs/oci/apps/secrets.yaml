# The SealedSecrets that scripts/seal.sh writes to envs/oci/secrets. Each names its own namespace, and the
# sealed-secrets controller turns it into the Secret a workload reads. A first sync can land before the
# monitoring, search and forecast namespaces exist, hence the retry.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/Tajaddin/k8s-platform-gitops.git
    targetRevision: main
    path: envs/oci/secrets
    directory: { include: "*.yaml" }
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 10m }
